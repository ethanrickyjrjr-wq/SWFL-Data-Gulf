<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spacing — Border radii</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_base.css">
</head>
<body class="preview">
<div class="card-frame">

<div style="display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap;">
  
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
      <div style="width:62px;height:62px;background:var(--gulf-slate);border:1px solid var(--gulf-haze);border-radius:2px;"></div>
      <div style="font-family:var(--font-mono);font-size:11px;color:var(--text-secondary);">xs · 2px</div>
      <div style="font-size:10px;color:var(--text-tertiary);">badge edges</div>
    </div>
  
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
      <div style="width:62px;height:62px;background:var(--gulf-slate);border:1px solid var(--gulf-haze);border-radius:4px;"></div>
      <div style="font-family:var(--font-mono);font-size:11px;color:var(--text-secondary);">sm · 4px</div>
      <div style="font-size:10px;color:var(--text-tertiary);">chips, small buttons</div>
    </div>
  
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
      <div style="width:62px;height:62px;background:var(--gulf-slate);border:1px solid var(--gulf-haze);border-radius:6px;"></div>
      <div style="font-family:var(--font-mono);font-size:11px;color:var(--text-secondary);">md · 6px</div>
      <div style="font-size:10px;color:var(--text-tertiary);">default card</div>
    </div>
  
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
      <div style="width:62px;height:62px;background:var(--gulf-slate);border:1px solid var(--gulf-haze);border-radius:10px;"></div>
      <div style="font-family:var(--font-mono);font-size:11px;color:var(--text-secondary);">lg · 10px</div>
      <div style="font-size:10px;color:var(--text-tertiary);">/connect install block</div>
    </div>
  
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
      <div style="width:62px;height:62px;background:var(--gulf-slate);border:1px solid var(--gulf-haze);border-radius:999px;"></div>
      <div style="font-family:var(--font-mono);font-size:11px;color:var(--text-secondary);">pill · 999px</div>
      <div style="font-size:10px;color:var(--text-tertiary);">pill chips only</div>
    </div>
  
</div>
</div></body></html>
