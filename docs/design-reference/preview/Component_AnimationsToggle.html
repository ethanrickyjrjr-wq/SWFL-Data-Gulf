<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Component — Animations toggle</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_base.css">
</head>
<body class="preview">
<div class="card-frame">

<div style="display:flex;gap:16px;align-items:center;">
  <div style="display:inline-flex;align-items:center;gap:10px;background:var(--gulf-slate);border:1px solid var(--gulf-haze);border-radius:999px;padding:6px 10px;">
    <span style="font-size:12px;color:var(--text-secondary);">Animations</span>
    <div style="width:32px;height:18px;background:var(--gulf-teal-dim);border-radius:999px;position:relative;">
      <div style="position:absolute;top:2px;right:2px;width:14px;height:14px;background:var(--text-primary);border-radius:50%;"></div>
    </div>
    <span style="font-size:12px;color:var(--text-primary);font-weight:500;">On</span>
  </div>
  <div style="display:inline-flex;align-items:center;gap:10px;background:var(--gulf-slate);border:1px solid var(--gulf-haze);border-radius:999px;padding:6px 10px;">
    <span style="font-size:12px;color:var(--text-secondary);">Animations</span>
    <div style="width:32px;height:18px;background:var(--gulf-haze);border-radius:999px;position:relative;">
      <div style="position:absolute;top:2px;left:2px;width:14px;height:14px;background:var(--text-tertiary);border-radius:50%;"></div>
    </div>
    <span style="font-size:12px;color:var(--text-tertiary);">Off</span>
  </div>
</div>
<div style="font-size:11px;color:var(--text-tertiary);">Persisted in localStorage as <span class="mono" style="font-size:11px;">swfl.animations</span>. Default on. Respects prefers-reduced-motion unconditionally.</div>
</div></body></html>
