<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Component — Buttons</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_base.css">
</head>
<body class="preview">
<div class="card-frame">

<div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap;">
  <button style="background:var(--gulf-teal);color:var(--text-on-accent);border:none;border-radius:4px;padding:10px 18px;font-family:var(--font-body);font-size:14px;font-weight:500;letter-spacing:0;cursor:pointer;">Install once</button>
  <button style="background:transparent;color:var(--gulf-teal);border:1px solid var(--gulf-teal-dim);border-radius:4px;padding:9px 17px;font-family:var(--font-body);font-size:14px;font-weight:500;cursor:pointer;">Get notified</button>
  <button style="background:transparent;color:var(--text-secondary);border:1px solid var(--gulf-haze);border-radius:4px;padding:9px 17px;font-family:var(--font-body);font-size:14px;font-weight:500;cursor:pointer;">Cancel</button>
  <button style="background:var(--gulf-slate);color:var(--text-tertiary);border:1px solid var(--gulf-haze);border-radius:4px;padding:8px 14px;font-family:var(--font-mono);font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
    Copy
  </button>
</div>
<div style="font-size:11px;color:var(--text-tertiary);">Primary teal (midnight text) · secondary outlined · tertiary slate · copy mono. Press: 1→0.96→1, 150ms.</div>
</div></body></html>
