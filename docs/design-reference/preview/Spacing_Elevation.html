<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spacing — Elevation (no shadows)</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_base.css">
</head>
<body class="preview">
<div class="card-frame">

<div style="display:flex;gap:14px;">
  
    <div style="flex:1;background:var(--gulf-midnight);border:1px solid var(--gulf-haze);border-radius:6px;padding:16px 14px;display:flex;flex-direction:column;gap:6px;min-height:80px;">
      <div style="font-size:12px;color:var(--text-primary);font-weight:500;">Background</div>
      <div class="mono" style="font-size:10px;">#0A1419</div>
    </div>
  
    <div style="flex:1;background:var(--gulf-deep);border:1px solid var(--gulf-haze);border-radius:6px;padding:16px 14px;display:flex;flex-direction:column;gap:6px;min-height:80px;">
      <div style="font-size:12px;color:var(--text-primary);font-weight:500;">Section</div>
      <div class="mono" style="font-size:10px;">#0F1D24</div>
    </div>
  
    <div style="flex:1;background:var(--gulf-slate);border:1px solid var(--gulf-haze);border-radius:6px;padding:16px 14px;display:flex;flex-direction:column;gap:6px;min-height:80px;">
      <div style="font-size:12px;color:var(--text-primary);font-weight:500;">Card</div>
      <div class="mono" style="font-size:10px;">#152832</div>
    </div>
  
    <div style="flex:1;background:var(--gulf-slate-hi);border:1px solid var(--gulf-haze);border-radius:6px;padding:16px 14px;display:flex;flex-direction:column;gap:6px;min-height:80px;">
      <div style="font-size:12px;color:var(--text-primary);font-weight:500;">Hover</div>
      <div class="mono" style="font-size:10px;">#1C3340</div>
    </div>
  
</div>
<div style="font-size:12px;color:var(--text-tertiary);">Elevation = surface ramp, not drop shadow. Borders separate cards; shadows are banned.</div>
</div></body></html>
