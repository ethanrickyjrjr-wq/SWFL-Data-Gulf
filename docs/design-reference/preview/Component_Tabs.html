<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Component — Tier tabs</title>
<link rel="stylesheet" href="../colors_and_type.css">

<body class="preview">
<div class="card-frame">

<div style="display:inline-flex;background:var(--gulf-deep);border:1px solid var(--gulf-haze);border-radius:6px;padding:4px;align-self:flex-start;font-family:var(--font-body);font-size:13px;">
  <button style="background:transparent;color:var(--text-secondary);border:none;padding:8px 16px;font:inherit;cursor:pointer;border-radius:4px;">Glance</button>
