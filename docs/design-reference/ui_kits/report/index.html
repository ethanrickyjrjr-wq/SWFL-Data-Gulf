<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SWFL Data Gulf — Master Report</title>
<link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../colors_and_type.css">
<link rel="stylesheet" href="report.css">
</head>
<body>
<div id="root" data-screen-label="Report Tier 2"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="views.jsx"></script>

<script type="text/babel">
const { useState, useEffect } = React;

function App() {
  const [tier, setTier] = useState("report");
  const [animationsOn, setAnimationsOn] = useState(() => {
    if (typeof window === "undefined") return true;
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return false;
    const pref = localStorage.getItem("swfl.animations");
    return pref ? pref === "on" : true;
  });
  // Persist
  useEffect(() => {
    localStorage.setItem("swfl.animations", animationsOn ? "on" : "off");
  }, [animationsOn]);

  // animationsOn ANDed with reduced-motion → ANIMATE
  const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const ANIMATE = animationsOn && !prefersReducedMotion;
  // Bump a key whenever the tier changes so the entry animations replay.
  const [animKey, setAnimKey] = useState(0);
  useEffect(() => { setAnimKey(k => k + 1); }, [tier, ANIMATE]);

  const report = window.MASTER_REPORT;

  return (
    <div className="rp-app">
      <Header
        token={report.freshness_token}
        animationsOn={animationsOn}
        onToggleAnimations={() => setAnimationsOn(v => !v)}
      />
      <main className="rp-content">
        <TierTabs active={tier} onChange={setTier} />
        <div key={animKey}>
          {tier === "glance" && <GlanceView report={report} animate={ANIMATE} />}
          {tier === "report" && <ReportView report={report} animate={ANIMATE} />}
          {tier === "audit"  && <AuditView  report={report} animate={ANIMATE} />}
        </div>
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
