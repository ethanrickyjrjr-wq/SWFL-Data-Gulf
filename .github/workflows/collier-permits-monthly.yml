name: Collier County permits monthly

on:
  # SCHEDULE RE-ENABLED 08/12/2026: both held conditions cleared and live-verified.
  # (1) GHA dry-run probe passed green (gh run 31565435973 — UndetectedAdapter clears
  #     Akamai from datacenter IP, XLSX download succeeds).
  # (2) collier_first_lake_ingestion gate cleared: real merge run landed 9,717 rows in
  #     data_lake.collier_building_permits (gh run 31566832140), and the geocoder
  #     timeout-drop bug found in that run was fixed + re-verified live (gh run
  #     31567459230 — July fill recovered 0%->47.3%, matching April's 46.3% baseline).
  # Guards live going into the schedule: assert_min_rows (4,477 floor), assert_content_fresh
  # (75d), dlt merge on permit_number (non-destructive), geocoder split-retry on timeout.
  schedule:
    - cron: "0 12 15 * *"
  workflow_dispatch:
    inputs:
      month:
        description: "YYYY-MM to ingest (default: previous calendar month)"
        required: false
        default: ""
      dry_run:
        description: "Dry run — download and parse only; skip geocode + dlt write"
        required: false
        default: "true"

permissions:
  contents: read

jobs:
  ingest:
    if: ${{ vars.ENGINE_ENABLED != 'false' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ingest dependencies
        run: pip install -r ingest/requirements.txt

      - name: Install crawl4ai browsers
        run: crawl4ai-setup

      - name: crawl4ai preflight (advisory)
        continue-on-error: true
        run: crawl4ai-doctor

      - name: Run Collier permits pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DESTINATION__POSTGRES__CREDENTIALS: ${{ secrets.DESTINATION__POSTGRES__CREDENTIALS }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.month }}" ]; then
            ARGS="--month ${{ github.event.inputs.month }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python -m ingest.pipelines.collier_permits.pipeline $ARGS
