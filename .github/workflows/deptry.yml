name: deptry

on:
  push:
    branches: [main]
    paths:
      - "ingest/**"
  pull_request:
    branches: [main]
    paths:
      - "ingest/**"

jobs:
  check-deps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install deptry
        run: pip install deptry

      # No --requirements-files flag: the CLI flag OVERRIDES pyproject.toml's
      # `requirements_files` list, and hardcoding requirements.txt here is what made
      # this workflow red on every run since 07/22/2026 — ingest/analysis/ imports
      # numpy/sklearn/pandas, which live in ingest/requirements-analysis.txt.
      # pyproject.toml [tool.deptry] is the ONE root for that list.
      - name: Check for missing dependencies
        run: deptry ingest
