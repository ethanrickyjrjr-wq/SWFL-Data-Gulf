name: Reverify closed-check signals (daily)

# 07/18/2026 — the free half of check-drift defense. A trust audit that day
# found 82 risk-flagged closed checks and had to re-verify them by hand (9
# agents, ~1.5M tokens) because only 1 of 267 evidenced closes carried a
# `signal` — a live, mechanically re-runnable assertion. This job re-runs
# every CLOSED check's stored signal on a clock, for the cost of an HTTP/DB
# read: no agent, no tokens. A signal that used to pass and now fails means
# the thing it verified has regressed, and gets auto-reopened — the next
# session's CHECK surfaces it instead of a human needing to notice, or an
# operator needing to pay for another manual sweep to find it.
#
# Distinct from a REGRESSION: a signal that never evaluates at all (bad
# params, an unimplemented type) is reported separately and never reopens
# anything — see scripts/reverify-signals.mjs's isRealRegression().

on:
  schedule:
    # 15:41 UTC — off the top-of-hour congestion band, well clear of the
    # nightly chain (04:23 UTC) and the freshness probe (14:00 UTC).
    - cron: "41 15 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run — report only, reopen nothing"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: reverify-signals-daily
  cancel-in-progress: false

jobs:
  reverify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Reverify every closed check's stored signal
        id: run
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -o pipefail
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            node scripts/reverify-signals.mjs --dry-run | tee scan.txt
          else
            node scripts/reverify-signals.mjs | tee scan.txt
          fi

      # WIRED 07/25/2026 — scripts/ceilings-to-checks.mjs shipped weeks ago and was
      # invoked by NOTHING: not a workflow, not a hook, not package.json. The 72
      # recorded source_ceilings became checks exactly once, by hand. That is the
      # "recording half built, acting half never wired" failure documented in
      # docs/standards/new-project-playbook.md §1 — a ceiling nobody surfaces is why
      # two sessions independently told the operator we had no beds/baths while it
      # sat recorded in the registry, twice.
      # Home chosen deliberately: same ledger, same daily cadence, same secrets
      # already proven in the step above. --apply is idempotent (data-roots.md:38),
      # so re-running cannot duplicate a check. continue-on-error so a ceiling
      # hiccup can never mask a signal regression, which is this workflow's day job.
      - name: Surface recorded source ceilings as checks (idempotent)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -o pipefail
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            node scripts/ceilings-to-checks.mjs
          else
            node scripts/ceilings-to-checks.mjs --apply
          fi

      # WIRED 08/06/2026 — the DRAINING half, and the reason this file needed it.
      # Measured that morning against public.checks: 879 open, and BOTH automatic
      # mechanisms in this workflow only push that number UP — the step above REOPENS
      # regressions, and ceilings-to-checks --apply OPENS new rows. scripts/check-sweep.mjs
      # (built 07/22) is the only thing that closes anything without a human typing a key,
      # and it was invoked by no workflow, no hook, and no package.json script — same
      # "recording half built, acting half never wired" shape as the ceilings postmortem
      # directly above, one level up. July: 1,018 opened / 447 closed. 14 of ~635 closes
      # ever were machine closes.
      # It can only close a check whose STORED signal passes live, re-validated
      # server-side by the checks_require_proof trigger — so this can never mass-close.
      # Today it closes 0 (0 of 879 open checks carry a signal); it exists so the drain is
      # automatic the moment signals start being attached at open time.
      # continue-on-error + last, so a sweep hiccup can never mask a signal regression,
      # which is this workflow's day job.
      - name: Auto-close open checks whose stored signal passes live
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -o pipefail
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            node scripts/check-sweep.mjs --dry-run
          else
            node scripts/check-sweep.mjs
          fi

      - name: Open or update the regression issue
        if: steps.run.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          body="$(printf '```\n%s\n```\nRun: %s/%s/actions/runs/%s' "$(cat scan.txt)" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
          existing=$(gh issue list --state open --search "SIGNAL REGRESSION in:title" --json number --jq '.[0].number' || true)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "SIGNAL REGRESSION — a closed check's stored signal now fails (or never evaluates)" --body "$body"
          fi

      - name: Fail the run on any regression or broken signal (visible red X)
        if: steps.run.outcome == 'failure'
        run: exit 1
