name: Neighborhood stats annual (aggregate parcel_subdivision_v)

on:
  schedule:
    # Day 24, after collier-parcels-annual (day 20) refreshes the wide table under the
    # parcel_subdivision_v view; lee_parcels is dispatch-only — re-dispatch this after any
    # manual Lee refresh. Idempotent either way against a stale run.
    - cron: "0 15 24 * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — read + aggregate only; skip the neighborhood_stats write"
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  aggregate:
    if: ${{ vars.ENGINE_ENABLED != 'false' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    # 45, not 20: scheduled run 30110144989 (07/24/2026) was killed at the 20m ceiling
    # (cancelled at 20m22s) and the kill was never diagnosed — doctor read the absence of
    # a landed load as NEVER_LANDED. The aggregate reads parcel_subdivision_v (a two-county
    # view over 920k+ parcels) before the in-memory DuckDB GROUP BY; give it real headroom.
    # If 45 is also hit, materialize the view read instead of raising again.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install ingest dependencies
        run: pip install -r ingest/requirements.txt

      - name: Run neighborhood_stats aggregation
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DESTINATION__POSTGRES__CREDENTIALS: ${{ secrets.DESTINATION__POSTGRES__CREDENTIALS }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="--dry-run"
          fi
          python -m ingest.duckdb_pipelines.neighborhood_stats.pipeline $ARGS
